name: Release Artifact

on:
  push:
    branches:
      - codex/release-ci

permissions:
  contents: write

jobs:
  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        run: pnpm run bump:version

      - name: Commit version bump
        run: |
          VERSION="$(node -p "require('./public/manifest.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/manifest.json package.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push

      - name: Build
        run: pnpm run build

      - name: Read extension version
        id: version
        run: |
          VERSION="$(node -p "require('./public/manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package dist
        run: |
          cd dist
          zip -r "../params-editor-${{ steps.version.outputs.version }}.zip" . -x "*.DS_Store"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: params-editor-${{ steps.version.outputs.version }}
          path: params-editor-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

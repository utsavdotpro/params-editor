name: Release

# Push to main reads the Chrome Web Store version, patch-bumps above
# max(repo, store) in the runner only, uploads, and submits for review.
# Nothing is pushed back to the repository. workflow_dispatch is for
# minor/major, upload-only, or dry run.
# GitHub skips this push trigger when the head commit contains
# [skip ci], [ci skip], [no ci], [skip actions], or [actions skip].

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump applied above max(repo version, store version)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish_target:
        description: publish submits for review; upload-only uploads and stops
        type: choice
        options:
          - publish
          - upload-only
        default: publish
      dry_run:
        description: Resolve the version and package only. Do not upload.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Require a dispatch from main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Resolve the deploy version from the store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: node scripts/resolve-deploy-version.mjs

      - name: Export release version
        id: version
        run: |
          VERSION="$(node -p "require('./public/manifest.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Production build
        run: pnpm run build:prod

      - name: Zip dist with manifest.json at the archive root
        run: node scripts/package-extension.mjs

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: params-editor-${{ steps.version.outputs.version }}
          path: params-editor-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload to the Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          ZIP_PATH: params-editor-${{ steps.version.outputs.version }}.zip
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target || 'publish' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/publish-cws.mjs

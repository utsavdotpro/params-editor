<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #111827; }
    .box { fill: #f3f4f6; stroke: #111827; stroke-width: 1.5; }
    .accent { fill: #d1fae5; stroke: #047857; stroke-width: 1.5; }
  </style>
  <rect class="box" x="16" y="70" width="140" height="64" rx="8"/>
  <text x="86" y="96" text-anchor="middle" font-size="14">push to main</text>
  <text x="86" y="116" text-anchor="middle" font-size="12">auto patch bump</text>
  <rect class="box" x="196" y="70" width="130" height="64" rx="8"/>
  <text x="261" y="96" text-anchor="middle" font-size="14">bump version</text>
  <text x="261" y="116" text-anchor="middle" font-size="12">manifest + package</text>
  <rect class="box" x="366" y="70" width="130" height="64" rx="8"/>
  <text x="431" y="96" text-anchor="middle" font-size="14">production zip</text>
  <text x="431" y="116" text-anchor="middle" font-size="12">manifest at root</text>
  <rect class="accent" x="536" y="70" width="150" height="64" rx="8"/>
  <text x="611" y="96" text-anchor="middle" font-size="14">CWS API v2</text>
  <text x="611" y="116" text-anchor="middle" font-size="12">upload, then publish</text>
  <rect class="box" x="726" y="70" width="230" height="64" rx="8"/>
  <text x="841" y="96" text-anchor="middle" font-size="14">commit, tag, GitHub Release</text>
  <text x="841" y="116" text-anchor="middle" font-size="12">only after upload is accepted</text>
  <path d="M156 102 H196 M326 102 H366 M496 102 H536 M686 102 H726" stroke="#111827" stroke-width="1.5"/>
  <text x="16" y="36" font-size="16">Release path</text>
  <text x="16" y="188" font-size="13">A bot commit starting with "chore: release v" does not deploy again. Dry run does not upload or push.</text>
</svg>

version: '3.9'
services:
  extension-dev:
    build:
      context: .
      dockerfile: docker/extension/Dockerfile
    container_name: params-editor-extension-dev
    working_dir: /app
    command: sh -c "pnpm install && pnpm run dev -- --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - pnpm-store:/pnpm/store
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  extension-build:
    build:
      context: .
      dockerfile: docker/extension/Dockerfile
    container_name: params-editor-extension-build
    working_dir: /app
    command: sh -c "pnpm install && pnpm run build"
    volumes:
      - ./:/app
      - pnpm-store:/pnpm/store
      - node_modules:/app/node_modules
    profiles: ["build"]

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: params-editor-pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pocketbase-data:/pb/pb_data
    command: ["serve", "--http=0.0.0.0:8090"]

volumes:
  pnpm-store:
  node_modules:
  pocketbase-data:

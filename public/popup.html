<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Query Param Editor</title>
  </head>
  <body class="w-[500px] p-2 font-sans flex flex-col h-screen m-0">
    <div class="flex flex-col flex-1 gap-4 relative">
      <div
        class="sticky top-0 bg-white z-10 flex flex-col gap-2 pb-2 border-b border-gray-200"
      >
        <div class="flex justify-between items-start gap-2 relative">
          <div class="h-12 bg-gray-100 rounded overflow-hidden">
            <div
              id="urlDisplay"
              class="p-2 break-all max-h-12 transition-all duration-300 relative flex-1 rounded bg-gray-100 hover:max-h-none hover:absolute hover:inset-x-0 hover:top-0 hover:shadow-md hover:z-20"
            ></div>
          </div>
          <button
            id="refreshBtn"
            class="bg-gray-100 text-gray-800 p-2 px-4 rounded font-medium hover:bg-gray-200"
          >
            <img
              src="https://unpkg.com/lucide-static@latest/icons/refresh-cw.svg"
              class="w-5 h-5 align-text-bottom stroke-current fill-none mr-1 inline"
              alt="Refresh"
            />
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto">
        <table class="w-full border-collapse flex-1" id="paramsTable">
          <thead>
            <tr>
              <th class="p-2 text-left">Key</th>
              <th class="p-2 text-left">Value</th>
              <th class="p-2 text-left"></th>
            </tr>
          </thead>
          <tbody id="paramsBody">
            <!-- Parameters will be added here dynamically -->
          </tbody>
        </table>
      </div>

      <div
        class="flex gap-2 sticky bottom-0 bg-white py-3 z-10 border-t border-gray-200"
      >
        <div class="flex-1">
          <div class="flex gap-2">
            <input
              type="text"
              class="w-full p-1.5 border border-gray-300 rounded focus:outline-none focus:border-green-500"
              id="newParamKey"
              placeholder="Key"
            />
            <input
              type="text"
              class="w-full p-1.5 border border-gray-300 rounded focus:outline-none focus:border-green-500"
              id="newParamValue"
              placeholder="Value"
            />
            <button
              class="flex items-center bg-green-500 text-white p-2 px-4 rounded font-medium hover:bg-green-600"
              id="addParamBtn"
            >
              <img
                src="https://unpkg.com/lucide-static@latest/icons/plus.svg"
                class="w-5 h-5 align-text-bottom stroke-current fill-none mr-1"
                alt="Add"
              />
              Add
            </button>
          </div>
          <div class="flex gap-2 justify-end pt-2">
            <button
              class="flex items-center bg-green-500 text-white p-2 px-4 rounded font-medium hover:bg-green-600"
              id="applyBtn"
            >
              <img
                src="https://unpkg.com/lucide-static@latest/icons/check.svg"
                class="w-5 h-5 align-text-bottom stroke-current fill-none mr-1"
                alt="Apply"
              />
              Apply
            </button>
            <button
              class="bg-gray-100 text-gray-800 p-2 px-4 rounded font-medium hover:bg-gray-200"
              id="resetBtn"
            >
              <img
                src="https://unpkg.com/lucide-static@latest/icons/undo.svg"
                class="w-5 h-5 align-text-bottom stroke-current fill-none mr-1"
                alt="Reset"
              />
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

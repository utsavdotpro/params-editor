<!doctype html>
<html>
  <head>
    <title>Query Param Editor</title>
    <style>
      @font-face {
        font-family: "LucideIcons";
        src: url(https://unpkg.com/lucide-static@latest/font/Lucide.ttf)
          format("truetype");
      }
      .icon {
        width: 1.2em;
        height: 1.2em;
        vertical-align: text-bottom;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        margin-right: 4px;
      }
      .icon-refresh::before {
        content: "\e9b3";
      }
      .icon-plus::before {
        content: "\e9a1";
      }
      .icon-check::before {
        content: "\e8b8";
      }
      .icon-undo::before {
        content: "\ea3c";
      }
      .icon-trash::before {
        content: "\ea2c";
      }
      body {
        width: 500px;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
      }
      .container {
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 16px;
        position: relative;
      }
      .url-section {
        position: sticky;
        top: 0;
        background: white;
        padding: 16px 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .url-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        position: relative;
      }
      .url-display {
        font-family: monospace;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 4px;
        word-break: break-all;
        max-height: 4.5em;
        overflow: hidden;
        transition: max-height 0.3s ease;
        position: relative;
        flex: 1;
      }
      .url-display:hover {
        max-height: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        background: white;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 2;
        padding: 8px;
      }
      .params-table {
        width: 100%;
        border-collapse: collapse;
        flex: 1;
      }
      .params-table th,
      .params-table td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      .param-input {
        width: 100%;
        padding: 6px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      .param-input:focus {
        outline: none;
        border-color: #4caf50;
      }
      .remove-btn {
        background: none;
        border: none;
        color: #ff4444;
        cursor: pointer;
        padding: 4px;
      }
      .remove-btn img {
        width: 1.2em;
        height: 1.2em;
      }
      .remove-btn:hover {
        color: #cc0000;
      }
      .add-param-section {
        display: flex;
        gap: 8px;
        position: sticky;
        bottom: 0;
        background: white;
        padding: 12px 0;
        z-index: 1;
        border-top: 1px solid #eee;
      }
      .action-buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding-top: 8px;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
      }
      .primary-btn {
        background-color: #4caf50;
        color: white;
      }
      .primary-btn:hover {
        background-color: #45a049;
      }
      .secondary-btn {
        background-color: #f5f5f5;
        color: #333;
      }
      .secondary-btn:hover {
        background-color: #e0e0e0;
      }
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 24px;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }
      input:checked + .toggle-slider {
        background-color: #4caf50;
      }
      input:checked + .toggle-slider:before {
        transform: translateX(26px);
      }
      .params-container {
        flex: 1;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="url-section">
        <div class="url-header">
          <div class="url-display" id="urlDisplay"></div>
          <button class="secondary-btn" id="refreshBtn">
            <img
              src="https://unpkg.com/lucide-static@latest/icons/refresh-cw.svg"
              class="icon"
              alt="Refresh"
            />
            Refresh
          </button>
        </div>
      </div>

      <div class="params-container">
        <table class="params-table" id="paramsTable">
          <thead>
            <tr>
              <th>Param Key</th>
              <th>Param Value</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="paramsBody">
            <!-- Parameters will be added here dynamically -->
          </tbody>
        </table>
      </div>

      <div class="add-param-section">
        <div style="flex: 1">
          <div style="display: flex; gap: 8px">
            <input
              type="text"
              class="param-input add-param-input"
              id="newParamKey"
              placeholder="Key"
            />
            <input
              type="text"
              class="param-input add-param-input"
              id="newParamValue"
              placeholder="Value"
            />
            <button class="primary-btn" id="addParamBtn">
              <img
                src="https://unpkg.com/lucide-static@latest/icons/plus.svg"
                class="icon"
                alt="Add"
              />
              Add
            </button>
          </div>
          <div class="action-buttons">
            <button class="primary-btn" id="applyBtn">
              <img
                src="https://unpkg.com/lucide-static@latest/icons/check.svg"
                class="icon"
                alt="Apply"
              />
              Apply
            </button>
            <button class="secondary-btn" id="resetBtn">
              <img
                src="https://unpkg.com/lucide-static@latest/icons/undo.svg"
                class="icon"
                alt="Reset"
              />
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

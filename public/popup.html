<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Query Param Editor</title>
  </head>
  <body class="w-[500px] p-3 pt-0 font-sans flex flex-col h-screen m-0">
    <div class="flex flex-col flex-1 gap-2 relative">
      <div
        class="sticky top-0 bg-white z-10 flex flex-col gap-2 py-3 border-b border-gray-200"
      >
        <div class="flex justify-between items-start gap-2 relative">
          <div class="h-12 bg-gray-100 rounded-md overflow-hidden flex-1">
            <div
              id="urlDisplay"
              class="p-2 break-all min-h-12 max-h-12 transition-all duration-300 relative flex-1 rounded-md bg-gray-100 hover:max-h-96 overflow-y-auto hover:absolute hover:inset-x-0 hover:top-0 hover:shadow-md hover:z-20 text-xs"
            ></div>
          </div>

          <img
            id="refreshBtn"
            src="https://unpkg.com/lucide-static@latest/icons/refresh-cw.svg"
            class="w-7 h-7 align-text-bottom stroke-current fill-none mr-1 inline bg-gray-100 text-gray-800 rounded font-medium hover:bg-gray-200 p-1 cursor-pointer"
            alt="Refresh"
          />
        </div>

        <!-- Search box -->
        <div
          class="flex items-center border border-green-500 rounded overflow-hidden"
        >
          <div class="px-2 text-gray-500">
            <img
              src="https://unpkg.com/lucide-static@latest/icons/search.svg"
              class="w-4 h-4 align-text-bottom stroke-current fill-none"
              alt="Search"
            />
          </div>
          <input
            type="text"
            id="searchParams"
            placeholder="Search parameters..."
            class="py-1.5 px-1 w-full border-none outline-none text-sm"
          />
          <button
            id="clearSearchBtn"
            class="px-2 text-gray-500 hidden hover:text-gray-700"
          >
            <img
              src="https://unpkg.com/lucide-static@latest/icons/x.svg"
              class="w-4 h-4 align-text-bottom stroke-current fill-none"
              alt="Clear"
            />
          </button>
        </div>
      </div>

      <div class="overflow-y-auto">
        <table
          class="w-full border-collapse table-fixed flex-1 text-sm"
          id="paramsTable"
        >
          <thead>
            <tr>
              <th class="p-1 text-left w-[30%]">Key</th>
              <th class="p-1 text-left w-[65%]">Value</th>
              <th class="p-1 text-center w-[5%]"></th>
            </tr>
          </thead>
          <tbody id="paramsBody">
            <!-- Parameters will be added here dynamically -->
          </tbody>
        </table>
      </div>

      <div
        class="flex gap-2 sticky bottom-0 bg-white py-3 z-10 border-t border-gray-200"
      >
        <div class="flex-1">
          <div class="flex gap-2 text-sm">
            <input
              type="text"
              class="flex-1 p-1.5 border border-gray-300 rounded focus:outline-none focus:border-green-500"
              id="newParamKey"
              placeholder="Key"
            />

            <input
              type="text"
              class="flex-1 p-1.5 border border-gray-300 rounded focus:outline-none focus:border-green-500"
              id="newParamValue"
              placeholder="Value"
            />

            <button
              class="flex flex-none items-center border border-black text-black py-1 px-3.5 rounded font-sm"
              id="addParamBtn"
            >
              <img
                src="https://unpkg.com/lucide-static@latest/icons/plus.svg"
                class="w-4 h-4 me-1"
                alt="Add"
              />
              Add
            </button>
          </div>

          <div class="flex items-center font-semibold gap-2 mt-3">
            <button
              class="flex items-center bg-green-500 text-white py-2 px-4 rounded font-sm hover:bg-green-600"
              id="applyBtn"
            >
              <img
                src="https://unpkg.com/lucide-static@latest/icons/check.svg"
                class="w-4 h-4 me-1"
                alt="Apply"
              />
              Apply
            </button>

            <button
              class="flex items-center bg-gray-100 text-gray-800 py-2 px-4 rounded font-sm hover:bg-gray-200"
              id="resetBtn"
            >
              <img
                src="https://unpkg.com/lucide-static@latest/icons/undo.svg"
                class="w-4 h-4 me-1"
                alt="Reset"
              />
              Reset
            </button>

            <div class="flex-1 text-end text-gray-600 font-light self-end">
              <span id="paramsCount"></span>
              Param(s)
            </div>
          </div>

          <!-- Error message container -->
          <div
            id="errorContainer"
            class="mt-3 p-3 bg-red-100 border border-red-300 rounded text-red-700 text-sm hidden"
          >
            <div class="flex items-start">
              <img
                src="https://unpkg.com/lucide-static@latest/icons/triangle-alert.svg"
                class="w-4 h-4 mr-2 stroke-current fill-none flex-shrink-0 mt-0.5"
                alt="Error"
              />
              <span id="errorMessage"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
